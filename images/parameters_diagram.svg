<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="paramNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26C6DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00838F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="380" rx="15" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="350" y="38" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">Parametros (Parameters)</text>
  <text x="350" y="58" text-anchor="middle" fill="#aaaacc" font-size="12">Configuracion dinamica de nodos en tiempo de ejecucion</text>

  <!-- Node box -->
  <rect x="220" y="80" width="260" height="80" rx="12" fill="url(#paramNodeGrad)" filter="url(#shadow)"/>
  <text x="350" y="112" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">/turtlesim</text>
  <text x="350" y="135" text-anchor="middle" fill="#b2ebf2" font-size="11">Nodo con parametros configurables</text>

  <!-- Parameters list -->
  <rect x="80" y="190" width="540" height="145" rx="10" fill="#2d2d4e" stroke="#26C6DA" stroke-width="1.5"/>
  <text x="350" y="215" text-anchor="middle" fill="#26C6DA" font-size="14" font-weight="bold">Parametros del nodo</text>

  <!-- Parameter entries -->
  <text x="120" y="245" fill="#81D4FA" font-size="12" font-weight="bold">background_b</text>
  <text x="300" y="245" fill="#aaa" font-size="12">: integer = 255</text>
  <rect x="470" y="233" width="120" height="18" rx="4" fill="#1565C0"/>
  <text x="530" y="246" text-anchor="middle" fill="#fff" font-size="10">Color fondo (azul)</text>

  <text x="120" y="270" fill="#81D4FA" font-size="12" font-weight="bold">background_g</text>
  <text x="300" y="270" fill="#aaa" font-size="12">: integer = 86</text>
  <rect x="470" y="258" width="120" height="18" rx="4" fill="#2E7D32"/>
  <text x="530" y="271" text-anchor="middle" fill="#fff" font-size="10">Color fondo (verde)</text>

  <text x="120" y="295" fill="#81D4FA" font-size="12" font-weight="bold">background_r</text>
  <text x="300" y="295" fill="#aaa" font-size="12">: integer = 69</text>
  <rect x="470" y="283" width="120" height="18" rx="4" fill="#C62828"/>
  <text x="530" y="296" text-anchor="middle" fill="#fff" font-size="10">Color fondo (rojo)</text>

  <text x="120" y="320" fill="#81D4FA" font-size="12" font-weight="bold">use_sim_time</text>
  <text x="300" y="320" fill="#aaa" font-size="12">: boolean = false</text>
  <rect x="470" y="308" width="120" height="18" rx="4" fill="#4A148C"/>
  <text x="530" y="321" text-anchor="middle" fill="#fff" font-size="10">Tiempo simulado</text>

  <!-- Connection line -->
  <line x1="350" y1="160" x2="350" y2="190" stroke="#26C6DA" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Footer -->
  <text x="350" y="365" text-anchor="middle" fill="#888899" font-size="10">Los parametros permiten modificar el comportamiento de un nodo sin recompilarlo</text>
</svg>
