<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowD" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD54F"/>
    </marker>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="750" height="480" rx="15" fill="#1a1a2e"/>
  <text x="375" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">Instalacion de ROS 2 Humble</text>
  <text x="375" y="55" text-anchor="middle" fill="#aaaacc" font-size="11">Ubuntu 22.04 LTS o superior</text>

  <!-- Step 1 -->
  <rect x="50" y="75" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="150" y="98" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1. Configurar locale</text>
  <text x="150" y="118" text-anchor="middle" fill="#bbdefb" font-size="9">UTF-8</text>

  <!-- Step 2 -->
  <rect x="275" y="75" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="375" y="98" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2. Habilitar Universe</text>
  <text x="375" y="118" text-anchor="middle" fill="#bbdefb" font-size="9">add-apt-repository</text>

  <!-- Step 3 -->
  <rect x="500" y="75" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="600" y="98" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3. Clave GPG</text>
  <text x="600" y="118" text-anchor="middle" fill="#bbdefb" font-size="9">ros-archive-keyring</text>

  <!-- Arrows row 1 -->
  <line x1="250" y1="102" x2="270" y2="102" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>
  <line x1="475" y1="102" x2="495" y2="102" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Step 4 -->
  <rect x="50" y="160" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="150" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">4. Agregar repo ROS 2</text>
  <text x="150" y="203" text-anchor="middle" fill="#bbdefb" font-size="9">sources.list.d</text>

  <!-- Step 5 -->
  <rect x="275" y="160" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="375" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">5. apt update + upgrade</text>
  <text x="375" y="203" text-anchor="middle" fill="#bbdefb" font-size="9">Actualizar cache</text>

  <!-- Arrows -->
  <line x1="600" y1="130" x2="600" y2="142" stroke="#FFD54F" stroke-width="2"/>
  <line x1="600" y1="142" x2="150" y2="142" stroke="#FFD54F" stroke-width="2"/>
  <line x1="150" y1="142" x2="150" y2="155" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>
  <line x1="250" y1="187" x2="270" y2="187" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Step 6: Install choice -->
  <rect x="500" y="160" width="200" height="55" rx="10" fill="#E65100" filter="url(#shadow)"/>
  <text x="600" y="183" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">6. Instalar ROS 2</text>
  <text x="600" y="203" text-anchor="middle" fill="#ffccbc" font-size="9">Elegir version</text>

  <line x1="475" y1="187" x2="495" y2="187" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Two options -->
  <rect x="500" y="240" width="95" height="45" rx="8" fill="#FF7043"/>
  <text x="547" y="260" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Desktop</text>
  <text x="547" y="275" text-anchor="middle" fill="#ffccbc" font-size="8">Completa + RVIZ2</text>

  <rect x="605" y="240" width="95" height="45" rx="8" fill="#F57C00"/>
  <text x="652" y="260" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Base</text>
  <text x="652" y="275" text-anchor="middle" fill="#ffe0b2" font-size="8">CLI + libs</text>

  <line x1="555" y1="215" x2="547" y2="236" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="645" y1="215" x2="652" y2="236" stroke="#FFD54F" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <!-- Step 7 -->
  <rect x="50" y="250" width="200" height="55" rx="10" fill="url(#stepGrad)" filter="url(#shadow)"/>
  <text x="150" y="273" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">7. Dev tools</text>
  <text x="150" y="293" text-anchor="middle" fill="#bbdefb" font-size="9">ros-dev-tools</text>

  <line x1="500" y1="262" x2="255" y2="277" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Verify section -->
  <rect x="50" y="340" width="650" height="55" rx="10" fill="url(#stepGrad2)" filter="url(#shadow)"/>
  <text x="375" y="363" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">8. Verificar instalacion</text>
  <text x="375" y="383" text-anchor="middle" fill="#c8e6c9" font-size="10">source /opt/ros/humble/setup.bash  ->  ros2 run demo_nodes_cpp talker  +  listener</text>

  <line x1="150" y1="305" x2="150" y2="320" stroke="#FFD54F" stroke-width="2"/>
  <line x1="150" y1="320" x2="375" y2="320" stroke="#FFD54F" stroke-width="2"/>
  <line x1="375" y1="320" x2="375" y2="336" stroke="#FFD54F" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Colcon -->
  <rect x="50" y="420" width="310" height="42" rx="8" fill="#2d2d4e" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="205" y="440" text-anchor="middle" fill="#90CAF9" font-size="11" font-weight="bold">sudo apt install python3-colcon-common-extensions</text>
  <text x="205" y="455" text-anchor="middle" fill="#666" font-size="9">Herramienta de compilacion para workspaces</text>

  <rect x="390" y="420" width="310" height="42" rx="8" fill="#2d2d4e" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="545" y="440" text-anchor="middle" fill="#A5D6A7" font-size="11" font-weight="bold">echo "source /opt/ros/humble/setup.bash" >> ~/.bashrc</text>
  <text x="545" y="455" text-anchor="middle" fill="#666" font-size="9">Cargar ROS 2 automaticamente al abrir terminal</text>
</svg>
